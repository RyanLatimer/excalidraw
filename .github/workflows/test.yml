name: Tests

on:
  push:
    branches: master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
      - name: Install and test
        run: |
          yarn install --frozen-lockfile
          yarn test:app --run --exclude 'selfhost/**'

  selfhost:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Typecheck
        run: yarn selfhost:typecheck
      - name: Test
        run: yarn selfhost:test
      - name: Build
        run: yarn selfhost:build
